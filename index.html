<!doctype html>
<html lang="es">
  <head>
    <!-- ============ PASO 1: SETUP INICIAL, SEO Y CDNs ============ -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaSmart | Tienda de smartphones y tecnología en Perú</title>

    <meta
      name="description"
      content="NovaSmart: tienda online de smartphones, audio y accesorios con garantía oficial, pago en cuotas y envío a todo el Perú."
    />
    <meta
      name="keywords"
      content="ecommerce, tienda online, comprar, productos, catálogo"
    />
    <meta name="author" content="Jackeline Vivanco Solano" />
    <meta name="robots" content="index, follow" />

    <!-- Bootstrap 5.3.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      /* IA: "¿Cómo evito que Tailwind sobrescriba los componentes de Bootstrap?"
       → Corrección manual: se desactiva preflight para que el reset de Tailwind
       no pise los estilos base de Bootstrap (botones, tarjetas, tipografía). */
      tailwind.config = {
        corePlugins: { preflight: false },
      };
    </script>
  </head>
  <body>
    <!-- ============ PASO 2: NAVBAR RESPONSIVO ============ -->
    <nav
      class="navbar navbar-expand-lg navbar-dark shadow-lg py-3"
      style="background: #0b1220"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" href="#"> NovaSmart </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuNav"
          aria-controls="menuNav"
          aria-expanded="false"
          aria-label="Abrir el menú de navegación"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
            <li class="nav-item">
              <a class="nav-link active" href="#">Inicio</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
                >Categorías</a
              >
              <ul class="dropdown-menu dropdown-menu-end rounded-xl shadow-lg">
                <li><a class="dropdown-item" href="#">Smartphones</a></li>
                <li><a class="dropdown-item" href="#">Audio</a></li>
                <li><a class="dropdown-item" href="#">Smartwatch</a></li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"
                >Ofertas
                <span class="badge rounded-pill bg-danger">-40%</span></a
              >
            </li>
            <li class="nav-item ms-lg-2">
              <a
                class="btn btn-sm text-white rounded-xl shadow-lg px-3"
                style="background: #0fb98b"
                href="#"
              >
                Carrito <span class="badge bg-white text-dark">3</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Bootstrap 5.3.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
